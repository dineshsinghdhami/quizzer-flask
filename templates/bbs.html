<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Semester Levels</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <script src="https://kit.fontawesome.com/a2e0e6ad0f.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/static/css/bbs.css">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

</head>
<body>
  <div class="circle circle1"></div>
  <div class="circle circle2"></div>

  <div class="sidebar">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>Semesters</h2>
      <button class="dark-toggle" id="themeToggle" title="Toggle Dark Mode">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>

    <div id="semesterList"></div>
    <div id="goBackBtn" class="go-back-btn">← Go Back</div>
  </div>

   <div class="content">
    <h2 id="selectedSemesterTitle">Select a semester</h2>
    <div id="levelsContainer" class="levels hidden">
      <button class="level-btn" data-level="Easy">Easy</button>
      <button class="level-btn" data-level="Medium">Medium</button>
      <button class="level-btn" data-level="Hard">Hard</button>
    </div>
  </div>

  <script src="/static/js/bbs.js">
  </script>
</body>
</html>
